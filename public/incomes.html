<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart.js with Month Filtering</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="navbar"></div>
    <script>
      // Load navbar.html into the div with id "navbar"
      fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('navbar').innerHTML = data;
        });
    </script>

    <div id="sidebar"></div>
    <script>
      // Load sidebar.html into the div with id "sidebar"
      fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar').innerHTML = data;
          attachSidebarHandlers();
          highlightButtons();
        });

      function attachSidebarHandlers() {
        const buttons = document.querySelectorAll('.button');
        buttons.forEach(button => {
          button.addEventListener('click', function() {
            const href = this.getAttribute('data-href');
            if (href) {
              window.location.href = href;
            }
          });
        });
      }

      function highlightButtons() {
        const url = window.location.pathname.split('/').pop();
        const buttons = document.querySelectorAll('.button');
        buttons.forEach(button => {
          const buttonUrl = button.getAttribute('data-href');
          if (buttonUrl === url) {
            button.style.backgroundColor = '#4a90e2';
          }
        });
      }
    </script>

    <div class="main-content">
        <div class="chart-container">
            <div class="chart-item">
                <h2>Chart Showing Revenue and Cost per Month</h2>
                <canvas id="financialChart"></canvas>
            </div>
            <div class="chart-item">
                <h2>Chart Showing Revenue</h2>
                <canvas id="salesChart"></canvas>
            </div>
            <div class="chart-item">
                <h2>Chart Showing Additional Income</h2>
                <canvas id="sideincomeChart"></canvas>
            </div>
        </div>

        <div class="filter-container">
            <div>
              <h3>Select Year</h3>
              <div id="yearButtons">
                <!-- Year buttons will be dynamically added here -->
              </div>
            </div>

            <div>
              <h3>Select Month</h3>
              <div id="monthButtons">
                <!-- Month buttons will be dynamically added here -->
              </div>
            </div>
        </div>
    </div>
</div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        let salesData = [];
        let grossData = [];
        let sideincomeData = [];
        const monthButtons = document.getElementById('monthButtons');
        const yearButtons = document.getElementById('yearButtons');
        let buttonsPopulated = false;

        // Function to format date to year
        function formatYear(dateString) {
            const date = new Date(dateString);
            return date.getFullYear().toString();
        }

        // Function to format date to month name
        function formatMonth(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('default', { month: 'long' });
        }

        // Function to populate year buttons
        function populateYearButtons(years) {
            const uniqueYears = Array.from(new Set(years));
            uniqueYears.forEach(year => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'year-btn';
                button.textContent = year;
                button.value = year;

                // Toggle button selection
                button.addEventListener('click', function () {
                    button.classList.toggle('selected');
                    updateCharts();
                });

                yearButtons.appendChild(button);
            });
        }

        // Function to populate the month buttons
        function populateMonthButtons(labels) {
            if (buttonsPopulated) return; // Prevent duplication
            const uniqueLabels = Array.from(new Set(labels));
            uniqueLabels.forEach((label) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'month-btn';
                button.textContent = label;

                // Toggle button selection
                button.addEventListener('click', function () {
                    button.classList.toggle('selected');
                    updateCharts();
                });

                monthButtons.appendChild(button);
            });
            buttonsPopulated = true; // Mark that buttons have been populated
        }

        function getSelectedYears() {
            return Array.from(document.querySelectorAll('.year-btn.selected')).map(button => button.textContent);
        }

        function getSelectedMonths() {
            return Array.from(document.querySelectorAll('.month-btn.selected')).map(button => button.textContent);
        }

        // Function to filter data based on selected months and years
        function filterData(selectedMonths, selectedYears, data) {
            return data.filter(row =>
                selectedMonths.includes(formatMonth(row.date)) &&
                selectedYears.includes(formatYear(row.date))
            );
        }

        // Function to update all charts
        function updateCharts() {
            const selectedMonths = getSelectedMonths();
            const selectedYears = getSelectedYears();
            const filteredSalesData = filterData(selectedMonths, selectedYears, salesData);
            const filteredGrossData = filterData(selectedMonths, selectedYears, grossData);
            const filteredSideincomeData = filterData(selectedMonths, selectedYears, sideincomeData);

            updatesalesChart(filteredSalesData);
            updateFinancialChart(filteredGrossData);
            updatesideincomeChart(filteredSideincomeData);
        }

        // Function to update the sales chart
        function updatesalesChart(filteredData) {
            salesChart.data.labels = filteredData.map(row => formatMonth(row.date));
            salesChart.data.datasets[0].data = filteredData.map(row => parseFloat(row.revenue.replace(/R|\s/g, '').replace(',', '.')));
            salesChart.update();
        }

        // Function to update the financial chart
        function updateFinancialChart(filteredData) {
            financialChart.data.labels = filteredData.map(row => formatMonth(row.date));
            financialChart.data.datasets[0].data = filteredData.map(row => parseFloat(row.sumofsales.replace(/R|\s/g, '').replace(',', '.')));
            financialChart.data.datasets[1].data = filteredData.map(row => parseFloat(row.sumofside.replace(/R|\s/g, '').replace(',', '.')));
            financialChart.update();
        }

        // This function is used to aggregate data from the side income, so categories that are the same combine
        function aggregateSideIncomeData(data) {
            const aggregated = {};
            
            // Aggregates the side income data by category
            data.forEach(row => {
                const category = row.category;
                const amount = parseFloat(row.sideincome.replace(/R|\s/g, '').replace(',', '.'));

                if (!aggregated[category]) {
                    aggregated[category] = 0;
                }
                aggregated[category] += amount;
            });

            return Object.keys(aggregated).map(category => ({
                category,
                amount: aggregated[category]
            }));
        }

        function updatesideincomeChart(filteredData) {
            // Aggregate the data by category
            const aggregatedData = aggregateSideIncomeData(filteredData);

            // Update the chart with aggregated data
            sideincomeChart.data.labels = aggregatedData.map(row => row.category);
            sideincomeChart.data.datasets[0].data = aggregatedData.map(row => row.amount);
            sideincomeChart.update();
        }

        // Fetch sales data
        fetch('/api/revenue')
            .then(response => response.json())
            .then(data => {
                salesData = data;
                const labels = salesData.map(row => formatMonth(row.date));
                populateMonthButtons(labels); // Populate buttons with sales data

                const ctx2 = document.getElementById('salesChart').getContext('2d');
                salesChart = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Revenue',
                                data: salesData.map(row => parseFloat(row.revenue.replace(/R|\s/g, '').replace(',', '.'))),
                                borderColor: 'rgba(15, 192, 0, 1)',
                                backgroundColor: 'rgba(15, 192, 0, 0.8)',
                                borderWidth: 1
                            }
                        ]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            });

        // Fetch gross data
        fetch('/api/company')
            .then(response => response.json())
            .then(data => {
                grossData = data;
                const labels = grossData.map(row => formatMonth(row.date));
                const years = grossData.map(row => formatYear(row.date));
                populateMonthButtons(labels);
                populateYearButtons(years);

                const ctx1 = document.getElementById('financialChart').getContext('2d');
                financialChart = new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Sales',
                                data: grossData.map(row => parseFloat(row.sumofsales.replace(/R|\s/g, '').replace(',', '.'))),
                                borderColor: 'rgba(85, 19, 100, 1)',
                                backgroundColor: 'rgba(85, 19, 100, 0.8)',
                                borderWidth: 1
                            },
                            {
                                label: 'Additional Income',
                                data: grossData.map(row => parseFloat(row.sumofside.replace(/R|\s/g, '').replace(',', '.'))),
                                borderColor: 'rgba(10, 19, 132, 1)',
                                backgroundColor: 'rgba(10, 19, 132, 0.8)',
                                borderWidth: 1
                            }
                        ]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            });

        // Fetch side income data
        fetch('/api/sideincome')
            .then(response => response.json())
            .then(data => {
                sideincomeData = data;

                // Create or update the chart
                const ctx = document.getElementById('sideincomeChart').getContext('2d');
                sideincomeChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: [], // Initially empty
                        datasets: [
                            {
                                label: 'Amount',
                                data: [], // Initially empty
                                borderColor: 'rgba(75, 192, 192, 1)',
                                backgroundColor: 'rgba(75, 192, 192, 0.8)',
                                borderWidth: 1
                            }
                        ]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });

                // Update the chart with the fetched and aggregated data
                updatesideincomeChart(sideincomeData);
            });
      });
    </script>
</body>
</html>
