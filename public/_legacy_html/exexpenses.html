<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
/* Updated Dropdown styles */
.dropdown {
        position: relative;
        display: inline-block;
        margin: 10px;
    }

    .dropdown select {
        appearance: none;
        background-color: #4CAF50;
        color: white;
        padding: 16px 40px 16px 16px; /* Increased right padding for the arrow */
        font-size: 16px;
        border: none;
        cursor: pointer;
        min-width: 160px;
        border-radius: 4px;
    }

    .dropdown::after {
        content: '\25BC'; /* Unicode for downward triangle */
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        pointer-events: none;
        color: white;
        transition: transform 0.3s ease;
    }

    .dropdown select:focus + .dropdown::after {
        transform: translateY(-50%) rotate(180deg);
    }

    .dropdown select:hover {
        background-color: #45a049;
    }

    .dropdown select:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.5);
    }

    /* Switch/Slider styles */
    .switch {
      position: relative;
      display: inline-block;
      width: 160px;
      height: 34px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2196F3;
    }

    input:checked + .slider:before {
      transform: translateX(126px);
    }

    .slider-text {
      position: absolute;
      width: 100%;
      text-align: center;
      line-height: 34px;
      color: white;
      font-size: 14px;
      font-family: Arial, sans-serif;
      z-index: 1;
    }

    .slider-container {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }


    .filter-dropdowns {
        display: flex;
        gap: 20px;
    }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <div id="sidebar"></div>
  
  <div class="main-content">
    <div class="chart-container">
      <div class="chart-item">
        <h2>Expenses vs Gross Profit vs Net Profit per Month</h2>
        <canvas id="ProfitChart"></canvas>
      </div>
      <div class="chart-item">
        <h2>Expenses</h2>
        <canvas id="expensesChart"></canvas>
      </div>
    </div>

    <div class="filter-dropdowns">
      <div>
          <h3>Select Year</h3>
          <div class="dropdown">
              <select id="yearSelect" class="dropdown-select">
                  <option value="">Select Year</option>
              </select>
          </div>
      </div>
      
      <div>
          <h3>Select Month</h3>
          <div class="dropdown">
              <select id="monthSelect" class="dropdown-select">
                  <option value="">Select Month</option>
              </select>
          </div>
      </div>
      </div>

    <div class="filter-container">
        <div>
            <h3>Trends</h3>
            <div class="slider-container">
                <label class="switch">
                    <input type="checkbox" id="sixMonthsToggle">
                    <span class="slider">
                        <span class="slider-text">6 Months</span>
                    </span>
                </label>
                <label class="switch">
                    <input type="checkbox" id="threeMonthsToggle">
                    <span class="slider">
                        <span class="slider-text">3 Months</span>
                    </span>
                </label>
            </div>
        </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let profitData = [];
      let expensesData = [];
      let ProfitChart;
      let expensesChart;

      function formatMonthYear(dateString) {
        const date = new Date(dateString);
        const month = date.toLocaleString('default', { month: 'long' });
        const year = date.getFullYear();
        return `${month} ${year}`;
      }

      function populateYearButtons(years, year) {
        const yearSelect = document.getElementById('yearSelect');
        yearSelect.innerHTML = '<option value="">Select Year</option>';
        const uniqueYears = Array.from(new Set(years));
        uniqueYears.forEach(year => {
          const option = document.createElement('option');
          option.value = year;
          option.textContent = year;
          yearSelect.appendChild(option);
        });
        yearSelect.addEventListener('change', updateCharts);
        yearSelect.value = year;
      }

      function populateMonthButtons(labels, month) {
        const monthSelect = document.getElementById('monthSelect');
        monthSelect.innerHTML = '<option value="">Select Month</option>';
        const uniqueLabels = Array.from(new Set(labels));
        uniqueLabels.forEach(label => {
          const option = document.createElement('option');
          option.value = label;
          option.textContent = label;
          monthSelect.appendChild(option);
        });
        monthSelect.addEventListener('change', updateCharts);
        monthSelect.value = month;
      }

      function getSelectedMonths() {
        const monthSelect = document.getElementById('monthSelect');
        return monthSelect.value ? [monthSelect.value] : [];
      }

      function getSelectedYears() {
        const yearSelect = document.getElementById('yearSelect');
        return yearSelect.value ? [yearSelect.value] : [];
      }

      function filterData(selectedMonths, selectedYears, data) {
        return data.filter(row => {
          const rowMonth = formatMonthYear(row.date).split(' ')[0];
          const rowYear = formatMonthYear(row.date).split(' ')[1];
          if (selectedMonths.length === 0 && selectedYears.length === 0) {
            return true;
          }
          if (selectedMonths.length === 0) {
            return selectedYears.includes(rowYear);
          }
          if (selectedYears.length === 0) {
            return selectedMonths.includes(rowMonth);
          }
          return selectedMonths.includes(rowMonth) && selectedYears.includes(rowYear);
        });
      }

      function updateCharts() {
        const selectedMonths = getSelectedMonths();
        const selectedYears = getSelectedYears();
        const filteredProfitData = filterData(selectedMonths, selectedYears, profitData);
        const filteredExpensesData = filterData(selectedMonths, selectedYears, expensesData);

        updateProfitChart(filteredProfitData);
        updateExpensesChart(filteredExpensesData);

        if (selectedMonths.length > 0 || selectedYears.length > 0) {
          document.getElementById('sixMonthsToggle').checked = false;
          document.getElementById('threeMonthsToggle').checked = false;
        }
      }

      function updateProfitChart(filteredData) {
        ProfitChart.data.labels = filteredData.map(row => formatMonthYear(row.date));
        ProfitChart.data.datasets[0].data = filteredData.map(row => parseFloat(row.grossprofit.replace(/R|\s/g, '').replace(',', '.')));
        ProfitChart.data.datasets[1].data = filteredData.map(row => parseFloat(row.expenses.replace(/R|\s/g, '').replace(',', '.')));
        ProfitChart.data.datasets[2].data = filteredData.map(row => parseFloat(row.netprofit.replace(/R|\s/g, '').replace(',', '.')));
        ProfitChart.update();
      }

      function aggregateExpensesData(data) {
        const aggregated = {};
        data.forEach(row => {
          let subcategory = row.subcategory;
          if (subcategory === 'Wages') {
            subcategory = 'Salaries & Wages';
          }
          const amount = parseFloat(row.amount.replace(/R|\s/g, '').replace(',', '.'));
          if (!aggregated[subcategory]) {
            aggregated[subcategory] = 0;
          }
          aggregated[subcategory] += amount;
        });
        return Object.keys(aggregated).map(subcategory => ({
          subcategory,
          amount: aggregated[subcategory]
        }));
      }

      function updateExpensesChart(filteredData) {
        const aggregatedData = aggregateExpensesData(filteredData);
        const labels = [];
        const expensesData = [];
        let salariesData = null;

        aggregatedData.forEach(row => {
          if (row.subcategory === 'Salaries & Wages') {
            salariesData = row.amount;
          } else {
            labels.push(row.subcategory);
            expensesData.push(row.amount);
          }
        });

        // Add Salaries & Wages as the last label
        labels.push('Salaries & Wages');
        expensesData.push(0); // Add a zero value for the primary y-axis
        
        expensesChart.data.labels = labels;
        expensesChart.data.datasets[0].data = expensesData;
        expensesChart.data.datasets[1].data = new Array(labels.length - 1).fill(null).concat([salariesData]);
        expensesChart.update();
      }

      function getLast6MonthsData(data) {
        const currentDate = new Date();
        const sixMonthsAgo = new Date(currentDate.getFullYear(), currentDate.getMonth() - 6, 1);
        return data.filter(row => new Date(row.date) >= sixMonthsAgo);
      }

      function getLast3MonthsData(data) {
        const currentDate = new Date();
        const threeMonthsAgo = new Date(currentDate.getFullYear(), currentDate.getMonth() - 3, 1);
        return data.filter(row => new Date(row.date) >= threeMonthsAgo);
      }

      function fetchDefaultMonthYear() {
        Promise.all([
          fetch('/api/exprofit').then(response => response.json()),
          fetch('/api/exexpenses').then(response => response.json())
        ])
        .then(([profitDataResponse, expenseDataResponse]) => {
          profitData = profitDataResponse;
          expensesData = expenseDataResponse.expenseData;
          const lastEntryDate = expenseDataResponse.lastEntryDate;
          const month = formatMonthYear(lastEntryDate).split(' ')[0];
          const year = formatMonthYear(lastEntryDate).split(' ')[1];
          const labels = profitData.map(row => formatMonthYear(row.date).split(' ')[0]);
          const years = profitData.map(row => formatMonthYear(row.date).split(' ')[1]);
          populateMonthButtons(labels, month);
          populateYearButtons(years, year);
          initializeCharts();
          updateCharts();
        })
        .catch(error => console.error('Error fetching data:', error));
      }

      function initializeCharts() {
        const ctx1 = document.getElementById('ProfitChart').getContext('2d');
        ProfitChart = new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: [],
            datasets: [
              {
                label: 'Gross Profit',
                data: [],
                borderColor: 'rgba(10, 25, 105, 1)',
                backgroundColor: 'rgba(10, 25, 105, 0.8)',
                borderWidth: 1
              },
              {
                label: 'Operating Expenses',
                data: [],
                borderColor: 'rgba(46, 117, 5, 1)',
                backgroundColor: 'rgba(46, 117, 5, 0.8)',
                borderWidth: 1
              },
              {
                label: 'Net Profit',
                data: [],
                borderColor: 'rgba(258, 63, 125, 1)',
                backgroundColor: 'rgba(258, 63, 125, 0.8)',
                borderWidth: 1
              }
            ]
          },
          options: {
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });

        const ctx2 = document.getElementById('expensesChart').getContext('2d');
        expensesChart = new Chart(ctx2, {
          type: 'bar',
          data: {
            labels: [],
            datasets: [
              {
                label: 'Expenses',
                data: [],
                borderColor: 'rgba(5, 19, 192, 1)',
                backgroundColor: 'rgba(5, 19, 192, 0.8)',
                borderWidth: 1,
                yAxisID: 'y'
              },
              {
                label: 'Salaries & Wages',
                data: [],
                borderColor: 'rgba(255, 99, 132, 1)',
                backgroundColor: 'rgba(255, 99, 132, 0.8)',
                borderWidth: 1,
                yAxisID: 'y1'
              }
            ]
          },
          options: {
            scales: {
              y: {
                type: 'linear',
                display: true,
                position: 'left',
                title: {
                  display: true,
                  text: 'Expenses'
                }
              },
              y1: {
                type: 'linear',
                display: true,
                position: 'right',
                title: {
                  display: true,
                  text: 'Salaries & Wages'
                },
                grid: {
                  drawOnChartArea: false
                }
              }
            }
          }
        });
      }

      document.getElementById('sixMonthsToggle').addEventListener('change', function() {
        if (this.checked) {
          document.getElementById('threeMonthsToggle').checked = false;
          document.getElementById('yearSelect').value = '';
          document.getElementById('monthSelect').value = '';
          updateProfitChart(getLast6MonthsData(profitData));
          updateExpensesChart(getLast6MonthsData(expensesData));
        }
      });

      document.getElementById('threeMonthsToggle').addEventListener('change', function() {
        if (this.checked) {
          document.getElementById('sixMonthsToggle').checked = false;
          document.getElementById('yearSelect').value = '';
          document.getElementById('monthSelect').value = '';
          updateProfitChart(getLast3MonthsData(profitData));
          updateExpensesChart(getLast3MonthsData(expensesData));
        }
      });

      fetchDefaultMonthYear();

      // Load navbar and sidebar
      fetch('exnavbar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('navbar').innerHTML = data;
        });

      fetch('exsidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar').innerHTML = data;
          attachSidebarHandlers();
          highlightButtons();
        });

      function attachSidebarHandlers() {
        const buttons = document.querySelectorAll('.button');
        buttons.forEach(button => {
          button.addEventListener('click', function() {
            const href = this.getAttribute('data-href');
            if (href) {
              window.location.href = href;
            }
          });
        });
      }

      function highlightButtons() {
        const url = window.location.pathname.split('/').pop();
        const buttons = document.querySelectorAll('.button');
        buttons.forEach(button => {
          const buttonUrl = button.getAttribute('data-href');
          if (buttonUrl === url) {
            button.style.backgroundColor = 'darkgreen';
          }
        });
      }
    });
  </script>
</body>
</html>
